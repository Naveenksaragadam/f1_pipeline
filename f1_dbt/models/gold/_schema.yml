version: 2

models:
  # ===========================================================================
  # 🏆 DIMENSION MODELS (The "Who", "Where", "What")
  # ===========================================================================

  - name: dim_circuits
    description: "Geographic and metadata for all F1 circuits (1950-present)"
    columns:
      - name: circuit_id
        description: "Primary Key: Unique identifier (e.g., 'spa')"
        tests: [unique, not_null]
      - name: circuit_name
        description: "Official venue name"
      - name: lat
        description: "GPS Latitude"
      - name: lng
        description: "GPS Longitude"
      - name: locality
        description: "City/Town location"
      - name: country
        description: "Country location"

  - name: dim_constructors
    description: "Reference table for F1 teams/constructors"
    columns:
      - name: constructor_id
        description: "Primary Key: Unique identifier (e.g., 'mclaren')"
        tests: [unique, not_null]
      - name: name
        description: "Full team name"
      - name: nationality
        description: "Country of team registration"

  - name: dim_drivers
    description: "Master list of all F1 drivers (Deduplicated across snapshots)"
    columns:
      - name: driver_id
        description: "Primary Key: Unique identifier (e.g., 'alonso')"
        tests: [unique, not_null]
      - name: full_name
        description: "Combined Given + Family Name"
      - name: permanent_number
        description: "Official career number"
      - name: code
        description: "3-letter driver code (e.g., 'FA1')"
      - name: nationality
        description: "Driver nationality"
      - name: date_of_birth
        description: "Birth date (ISO format)"

  - name: dim_races
    description: "Event metadata for every Grand Prix"
    columns:
      - name: season
        description: "Year of the championship"
        tests: [not_null]
      - name: round
        description: "Chronological race number in the season"
        tests: [not_null]
      - name: race_name
        description: "Official event name"
      - name: circuit_id
        description: "Foreign Key: Linked to dim_circuits"
      - name: race_date
        description: "Scheduled race date"

  - name: dim_status
    description: "Reference for race finishing/retirement status codes"
    columns:
      - name: status_id
        description: "Primary Key: Unique id"
        tests: [unique, not_null]
      - name: status_text
        description: "Human-readable status (e.g., 'Engine', '+1 Lap')"
      - name: is_classified
        description: "Boolean: Whether the driver was classified in the final results"

  # ===========================================================================
  # 📊 FACT MODELS (The "Numbers" and "Events")
  # ===========================================================================

  - name: fct_constructor_standings
    description: "Cumulative team points and rankings per race"
    columns:
      - name: season
        description: "Year link to dim_races"
        tests: [not_null]
      - name: round
        description: "Round link to dim_races"
        tests: [not_null]
      - name: constructor_id
        description: "Foreign Key: Linked to dim_constructors"
        tests: [not_null]
      - name: position
        description: "Championship rank at this point in the season"
      - name: points
        description: "Total points accumulated"
      - name: wins
        description: "Total race wins in this season so far"

  - name: fct_driver_standings
    description: "Cumulative driver points and rankings per race"
    columns:
      - name: season
        description: "Year link to dim_races"
        tests: [not_null]
      - name: round
        description: "Round link to dim_races"
        tests: [not_null]
      - name: driver_id
        description: "Foreign Key: Linked to dim_drivers"
        tests: [not_null]
      - name: position
        description: "Championship rank at this point in the season"
      - name: points
        description: "Total points accumulated"
      - name: wins
        description: "Total race wins in this season so far"

  - name: fct_lap_times
    description: "Individual performance per lap (High-volume telemetry fact)"
    columns:
      - name: season
        description: "Year link to dim_races"
        tests: [not_null]
      - name: round
        description: "Round link to dim_races"
        tests: [not_null]
      - name: driver_id
        description: "Foreign Key: Linked to dim_drivers"
        tests: [not_null]
      - name: lap_number
        description: "Lap count relative to start"
        tests: [not_null]
      - name: track_position
        description: "Positional ranking during this lap"
      - name: lap_time
        description: "Formatted lap time (e.g., 1:24.321)"

  - name: fct_pit_stops
    description: "Pit event timing and sequence"
    columns:
      - name: season
        description: "Year link to dim_races"
        tests: [not_null]
      - name: round
        description: "Round link to dim_races"
        tests: [not_null]
      - name: driver_id
        description: "Foreign Key: Linked to dim_drivers"
        tests: [not_null]
      - name: stop_number
        description: "Sequence of the stop (1st, 2nd, etc.)"
      - name: duration_raw
        description: "Unformatted API duration string"

  - name: fct_qualifying
    description: "Grid positions and session performance"
    columns:
      - name: season
        description: "Year link to dim_races"
        tests: [not_null]
      - name: round
        description: "Round link to dim_races"
        tests: [not_null]
      - name: driver_id
        description: "Foreign Key: Linked to dim_drivers"
        tests: [not_null]
      - name: constructor_id
        description: "Foreign Key: Linked to dim_constructors"
      - name: best_qualifying_time
        description: "Fastest time from across Q1/Q2/Q3 sessions"

  - name: fct_race_results
    description: "Core race finish results and points awarded"
    columns:
      - name: season
        description: "Year link to dim_races"
        tests: [not_null]
      - name: round
        description: "Round link to dim_races"
        tests: [not_null]
      - name: driver_id
        description: "Foreign Key: Linked to dim_drivers"
        tests: [not_null]
      - name: constructor_id
        description: "Foreign Key: Linked to dim_constructors"
      - name: finish_position
        description: "Official finishing rank"
      - name: points
        description: "Points awarded for this race"
      - name: positions_gained
        description: "Difference between grid position and finish position"

  - name: fct_sprint_results
    description: "Results for Sprint Qualifying events"
    columns:
      - name: season
        description: "Year link to dim_races"
        tests: [not_null]
      - name: round
        description: "Round link to dim_races"
        tests: [not_null]
      - name: driver_id
        description: "Foreign Key: Linked to dim_drivers"
        tests: [not_null]
      - name: constructor_id
        description: "Foreign Key: Linked to dim_constructors"
      - name: positions_gained
        description: "Difference between grid position and finish position"
