name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLICKHOUSE_PASSWORD: "ci-dummy-password"
      MINIO_ACCESS_KEY: "ci-dummy-key"
      MINIO_SECRET_KEY: "ci-dummy-secret"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install Dependencies
        run: uv sync

      - name: Check Formatting (ruff format)
        run: uv run ruff format --check src tests dags

      - name: Lint Code (ruff check)
        run: uv run ruff check src tests dags

      - name: Type Check (mypy)
        run: uv run mypy src tests dags

      - name: Run Tests with 100% Coverage Threshold
        run: |
          rm -f .coverage
          uv run pytest tests/ --cov=src/f1_pipeline --cov-fail-under=100

      - name: Verify Lockfile Sync
        run: uv lock --check

      - name: Verify Dependency Sync (pyproject.toml -> requirements.txt)
        run: |
          uv pip compile pyproject.toml --no-header --universal -o requirements.txt.tmp
          # Compare content while ignoring the first few lines of header if they exist
          diff <(grep -v "^#" requirements.txt) <(grep -v "^#" requirements.txt.tmp) || (echo "requirements.txt is out of sync with pyproject.toml. Run 'uv pip compile pyproject.toml --universal -o requirements.txt' locally or use 'bash scripts/sync-deps.sh'." && exit 1)
          rm requirements.txt.tmp
        
      - name: Security audit
        run: |
          uv sync
          uv run pip-audit --local

      - name: dbt Compilation Check
        env:
          CLICKHOUSE_HOST: "localhost"
          CLICKHOUSE_PASSWORD: ""
        run: |
          uv pip install dbt-clickhouse
          # `dbt parse` validates Jinja syntax, model references, and schema
          # without requiring a live DB connection — correct for CI linting.
          cd f1_dbt && uv run dbt deps && uv run dbt parse --target ci

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

  docker-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Airflow Docker Image
        run: docker compose build airflow-webserver

